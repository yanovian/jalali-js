name: Update Dependencies (breaking)

# `PAT_TOKEN` (a real personal access token, not the default GITHUB_TOKEN) is required: a
# GITHUB_TOKEN-authored pull request cannot trigger this repo's own ci.yml, so nothing would
# check the update once opened. See yanovian/update-dependencies-action's README, "Permissions
# and tokens". `min-release-age-days: 30` gives a compromised or broken release a month to get
# caught before this repo ever picks it up.
#
# Every 6 months, not the monthly cadence yanovian/chrome-ext-tabby uses for this same action:
# a breaking update needs real, hand-done migration review here, so this repo picks a slower,
# more deliberate cadence than a browser extension does. Offset an hour from
# update-dependencies-non-breaking.yml's own 1st-of-the-month run so the two never race on the
# two months (January, July) where both fire.

on:
  schedule:
    - cron: '0 5 1 1,7 *' # January 1st and July 1st, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yanovian/update-dependencies-action@v1
        with:
          update-strategy: breaking
          create-pull-request: true
          min-release-age-days: 30
          github-token: ${{ secrets.PAT_TOKEN }}
