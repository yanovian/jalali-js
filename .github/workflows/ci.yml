name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: make install-frozen

      - name: Typecheck
        run: make typecheck

      - name: Lint
        run: make lint

      - name: Check formatting
        run: make format-check

      - name: Check package READMEs
        run: make check-readmes

      - name: Run tests
        run: make test

      - name: Build packages
        run: make build-packages

      - name: Build playground apps
        run: make build-apps

      - name: Build docs
        run: make build-docs

      - name: Check bundle size
        run: make size

  # Slim matrix: package typecheck, unit tests, and package builds on each
  # supported Node LTS. Full lint/docs/apps stay on Node 24 above.
  node-matrix:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: make install-frozen

      - name: Typecheck
        run: make typecheck

      - name: Run tests
        run: make test

      - name: Build packages
        run: make build-packages
