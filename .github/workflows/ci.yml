name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: make install-frozen

      - name: Typecheck
        run: make typecheck

      - name: Lint
        run: make lint

      - name: Check formatting
        run: make format-check

      - name: Run tests
        run: make test

      - name: Build packages
        run: make build-packages

      - name: Build playground apps
        run: make build-apps

      - name: Check bundle size
        run: make size
