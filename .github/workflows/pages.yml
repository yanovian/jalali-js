name: Deploy docs and playground to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'apps/docs/**'
      - 'apps/playground-react/**'
      - 'apps/playground-vue/**'
      - 'apps/playground-vanilla/**'
      - 'packages/**'
      - '.github/workflows/pages.yml'
      - '.github/actions/build-pages-dist/**'
      - 'scripts/pages-previews.mjs'
  workflow_dispatch:

# Serialize with pr-playground.yml so preview paths and master docs do not race.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Pages dist
        uses: ./.github/actions/build-pages-dist
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
