name: Deploy docs and playground to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'apps/docs/**'
      - 'apps/playground-react/**'
      - 'apps/playground-vue/**'
      - 'apps/playground-vanilla/**'
      - 'packages/**'
      - '.github/workflows/pages.yml'
      - 'scripts/pr-previews.mjs'
  workflow_dispatch:

# Serialize with PR preview deploys so only one site tree goes live at a time.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: make install-frozen

      - name: Build docs and mirror open PR previews
        # embed-playgrounds + build-docs, then copy live /pr-* trees for open PRs
        # so a master docs deploy does not wipe preview paths.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: https://jalali-js.yanovian.com
        run: make pages-dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
