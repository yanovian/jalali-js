name: Update visual baselines

# Manual only: a maintainer runs this (pick the branch to run it from in the "Run workflow"
# dialog — typically a PR's own branch, once its screenshot diff in the e2e.yml PR comment has
# been reviewed and accepted) to make that branch's current renders the new baseline everyone
# else diffs against. Regenerates every screenshot from scratch across all three browsers and
# force-replaces the orphan `visual-baselines` branch with the result: baselines keep no
# history of their own on purpose (only the current one is ever meaningful for diffing), unlike
# `visual-snapshots`, which accumulates per-PR so old PR comments keep working.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: make install-frozen

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Regenerate every screenshot
        run: pnpm exec playwright test --update-snapshots

      - name: Publish new baselines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORK=$(mktemp -d)
          git clone --quiet --depth=1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$WORK"
          cd "$WORK"
          git checkout --orphan visual-baselines
          git rm -rf . >/dev/null 2>&1 || true
          for dir in "$GITHUB_WORKSPACE"/e2e/*.spec.ts-snapshots; do
            [ -d "$dir" ] && cp -r "$dir" .
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Update visual baselines from $GITHUB_REF_NAME ($GITHUB_SHA)"
          git push --quiet --force origin HEAD:visual-baselines
