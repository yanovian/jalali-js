name: PR playground previews

# Publishes short-lived playgrounds under /pr-<n>/ on GitHub Pages.
# Preview trees live on the orphan `pages-previews` branch. This workflow
# never calls deploy-pages from a pull_request job (the github-pages
# environment only allows master). It updates pages-previews, then asks
# pages.yml on master to rebuild and merge those folders.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  schedule:
    # Weekly orphan sweep for /pr-* folders with no open PR.
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Serialize preview branch writes. Do not share the `pages` group: this job
# waits on pages.yml, and a shared group would deadlock.
concurrency:
  group: pages-previews
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  SITE_URL: https://jalali-js.yanovian.com

jobs:
  publish:
    name: Publish PR playgrounds
    if: >
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: make install-frozen

      - name: Build PR playgrounds
        run: make embed-pr-playgrounds PR=${{ github.event.pull_request.number }} PR_PREVIEW_OUT=dist-pr

      - name: Store preview on pages-previews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/pages-previews.mjs publish \
            "${{ github.event.pull_request.number }}" \
            "dist-pr/pr-${{ github.event.pull_request.number }}"

      - name: Redeploy Pages from master
        id: redeploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Master must already contain scripts/pages-previews.mjs (this PR's
          # pages.yml merge step). Until then, skip live deploy so the check
          # stays green; later PRs get live /pr-<n>/ URLs.
          if ! gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/pages-previews.mjs?ref=master" \
            --silent >/dev/null 2>&1; then
            echo "Master does not merge PR previews yet. Live /pr-<n>/ links start after this lands."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/redeploy-pages.sh
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Comment preview links on the PR
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SITE_URL: ${{ env.SITE_URL }}
          DEPLOYED: ${{ steps.redeploy.outputs.deployed }}
        with:
          script: |
            const prNumber = process.env.PR_NUMBER;
            const site = process.env.SITE_URL.replace(/\/$/, '');
            const deployed = process.env.DEPLOYED === 'true';
            const marker = '<!-- pr-playground-preview -->';
            let body = `${marker}\n## Playground previews\n\n`;
            if (deployed) {
              body += 'Temporary builds from this PR. GitHub Pages removes them when the PR closes.\n\n';
            } else {
              body += 'Preview files are stored. Live `/pr-<n>/` URLs start after the Pages merge helper is on `master` (this landing PR), then on later PRs.\n\n';
            }
            body += `- [React](${site}/pr-${prNumber}/playground/react/)\n`;
            body += `- [Vue](${site}/pr-${prNumber}/playground/vue/)\n`;
            body += `- [Web Components](${site}/pr-${prNumber}/playground/vanilla/)\n`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(prNumber),
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(prNumber),
                body,
              });
            }

  remove:
    name: Remove PR playgrounds
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Use the PR head so remove still works when master does not have
          # the preview scripts yet (the landing PR for this workflow).
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Remove preview from pages-previews
        id: remove
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          node scripts/pages-previews.mjs remove "${{ github.event.pull_request.number }}" \
            | tee /tmp/pages-previews-out.txt
          tail -n 1 /tmp/pages-previews-out.txt >> "$GITHUB_OUTPUT"

      - name: Redeploy Pages from master
        if: steps.remove.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/pages-previews.mjs?ref=master" \
            --silent >/dev/null 2>&1; then
            echo "Master does not merge PR previews yet; skip redeploy."
            exit 0
          fi
          bash scripts/redeploy-pages.sh

  sweep:
    name: Sweep orphan PR playgrounds
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master

      - name: List open pull requests
        id: open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nums=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq 'map(.number|tostring) | join(",")')
          echo "prs=$nums" >> "$GITHUB_OUTPUT"

      - name: Sweep pages-previews
        id: sweep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          node scripts/pages-previews.mjs sweep "${{ steps.open.outputs.prs }}" \
            | tee /tmp/pages-previews-out.txt
          tail -n 1 /tmp/pages-previews-out.txt >> "$GITHUB_OUTPUT"

      - name: Redeploy Pages from master
        if: steps.sweep.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/redeploy-pages.sh
