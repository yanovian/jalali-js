name: Release

# Triggered by a maintainer pushing a tag (make tag-release TAG=v1.0.0), matching the org's own
# tag-triggered release convention. That local command already bumps every changed package's
# version via Changesets, commits, tags, and pushes, so by the time this workflow runs, the
# versions to publish are already committed; this just checks, builds, publishes, and cuts a
# GitHub release. `changeset publish` only publishes a package whose current package.json
# version isn't already on npm, so it's safe to run unconditionally here.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: make install-frozen

      - name: Typecheck
        run: make typecheck

      - name: Lint
        run: make lint

      - name: Check formatting
        run: make format-check

      - name: Run tests
        run: make test

      - name: Publish
        run: pnpm release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
