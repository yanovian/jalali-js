name: Release

# Triggered by a maintainer pushing a tag (make release-patch, -minor, or -major). That local
# command already bumps every package under packages/* to the same new version (`pnpm version`,
# extended across packages via `pnpm --filter`), commits, tags, and pushes, so by the time this
# workflow runs, the versions to publish are already committed; this just checks, publishes,
# and creates the GitHub release.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: make install-frozen

      - name: Typecheck
        run: make typecheck

      - name: Lint
        run: make lint

      - name: Check formatting
        run: make format-check

      - name: Run tests
        run: make test

      - name: Build
        run: make build-packages

      - name: Publish to npm
        run: make publish-packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
