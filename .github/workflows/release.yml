name: Release

# Triggered by a maintainer pushing a tag (make tag-release TAG=v0.0.1), matching the org's own
# tag-triggered release convention. That local command already bumps every changed package's
# version via Changesets, commits, tags, and pushes, so by the time this workflow runs, the
# versions to publish are already committed; this just checks, then publishes.
#
# `changesets/action` with only a `publish:` input (no `version:`), not a plain `pnpm release`
# shell step: it publishes the same way, but also creates one GitHub Release per published
# package (e.g. `jalali-js@0.0.1`, `@jalali-js/react@0.0.1`), each with that package's own real
# changelog entry as its body, not a generic auto-generated PR list. `changeset publish` only
# publishes a package whose current version isn't already on npm, so it's safe to run
# unconditionally here.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: make install-frozen

      - name: Typecheck
        run: make typecheck

      - name: Lint
        run: make lint

      - name: Check formatting
        run: make format-check

      - name: Run tests
        run: make test

      - name: Publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
